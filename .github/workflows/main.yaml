name: VProfile CI

on:
  push:
    branches:
      - main
      - stage
  pull_request:
    branches:
      - main
      - stage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-analyze:
    name: Build, Test and SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Maven version
        run: mvn --version

      # - name: Run Checkstyle
      #   run: mvn --batch-mode checkstyle:check

      - name: Build and run tests
        run: mvn --batch-mode clean verify

      - name: SonarCloud analysis
        if: success()
        env:
          SONAR_TOKEN: ${{ vars.SONAR_TOKEN }}
        run: >
          mvn --batch-mode sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}

  BUILD_AND_PUBLISH:
    needs: build-and-analyze
    name: Build and Publish Docker Image to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ vars.ECR_REPOSITORY }} .
          docker tag ${{ vars.ECR_REPOSITORY }}:latest ${{ vars.REGISTRY }}/${{ vars.ECR_REPOSITORY }}:latest
          docker tag ${{ vars.ECR_REPOSITORY }}:latest ${{ vars.REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.run_number }}
          docker push ${{ vars.REGISTRY }}/${{ vars.ECR_REPOSITORY }}:latest
          docker push ${{ vars.REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.run_number }}
