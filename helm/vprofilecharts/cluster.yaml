
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: vprofile-eks
  region: us-east-1
  version: "1.37"

iam:
  withOIDC: true

managedNodeGroups:
  - name: vprofile-ng
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 2
    volumeSize: 30
    privateNetworking: false
    labels:
      role: vprofile-worker
    tags:
      Project: VProfile
      Environment: Learning
