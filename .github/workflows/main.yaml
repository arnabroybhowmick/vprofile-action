name: VProfile CI

on:
  push:
    branches:
      - main
      - stage
  pull_request:
    branches:
      - main
      - stage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-analyze:
    name: Build, Test and SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Maven version
        run: mvn --version

      # - name: Run Checkstyle
      #   run: mvn --batch-mode checkstyle:check

      - name: Build and run tests
        run: mvn --batch-mode clean verify

      - name: SonarCloud analysis
        if: success()
        env:
          SONAR_TOKEN: ${{ vars.SONAR_TOKEN }}
        run: >
          mvn --batch-mode sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}

  BUILD_AND_PUBLISH:
    needs: build-and-analyze
    name: Build and Publish Docker Image to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ vars.ECR_REPOSITORY }} .
          docker tag ${{ vars.ECR_REPOSITORY }}:latest ${{ vars.REGISTRY }}/${{ vars.ECR_REPOSITORY }}:latest
          docker tag ${{ vars.ECR_REPOSITORY }}:latest ${{ vars.REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.run_number }}
          docker push ${{ vars.REGISTRY }}/${{ vars.ECR_REPOSITORY }}:latest
          docker push ${{ vars.REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.run_number }}

  DeployToEKS:
    needs: BUILD_AND_PUBLISH
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get Kube config file
        run: aws eks update-kubeconfig --region ${{ vars.AWS_REGION }} --name vprofile-eks

      - name: Login to ECR
        run: |
          kubectl create secret docker-registry regcred \
            --docker-server=${{ vars.REGISTRY }} \
            --docker-username=AWS \
            --docker-password=$(aws ecr get-login-password --region ${{ vars.AWS_REGION }}) \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Helm
        uses: bitovi/github-actions-deploy-eks-helm@v1.2.8
        with:
          aws-access-key-id: ${{vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          cluster-name: ${{ vars.EKS_CLUSTER }}
          #config-files: .github/values/dev.yaml
          chart-path: helm/vprofilecharts
          namespace: default
          values: appimage=${{ vars.REGISTRY }}/${{ vars.ECR_REPOSITORY }},apptag=latest
          name: vprofile-stack
