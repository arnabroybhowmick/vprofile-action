name: VProfile CI

on:
  push:
    branches:
      - main
      - stage
  pull_request:
    branches:
      - main
      - stage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-analyze:
    name: Build, Test and SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Maven version
        run: mvn --version

      # - name: Run Checkstyle
      #   run: mvn --batch-mode checkstyle:check

      - name: Build and run tests
        run: mvn --batch-mode clean verify

      - name: SonarCloud analysis
        if: success()
        env:
          SONAR_TOKEN: ${{ vars.SONAR_TOKEN }}
        run: >
          mvn --batch-mode sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}

  BUILD_AND_PUBLISH:
    needs: build-and-analyze
    name: Build and Publish Docker Image to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Build & Upload image to ECR
        uses: appleboy/docker-ecr-action@master
        with:
          access_key: ${{ vars.AWS_ACCESS_KEY_ID }}
          secret_key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          registry: ${{ vars.REGISTRY }}
          repo: ${{ env.ECR_REPOSITORY }}
          region: ${{ env.AWS_REGION }}
          tags: latest,${{ github.run_number }}
          daemon_off: false
          dockerfile: ./Dockerfile
          context: ./
